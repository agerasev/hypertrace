# All colors are linear RGB. Lengths use the curvature radius R, time uses seconds.
# Coordinates on Earth are local X and Z displacements applied in that order.
[earth]
material = { kind = "diffuse", color = [0.23, 0.48, 0.10] }

[sun]
distance = 3.0
emission = { color = [1.0, 0.96, 0.82], intensity = 100.0 }

[moon]
ground_offset = [-0.971987, 0.020546]
distance = 1.325230
subdivisions = 128
material = { kind = "diffuse", color = [0.76, 0.76, 0.74] }

[ambient]
night = { color = [0.4, 0.5, 0.7], intensity = 0.01 }
day = { color = [0.65, 0.70, 0.75], intensity = 0.20 }
# mix(night, day, clamp(response_factor * peak_solar_radiance * sin²(disk_radius), 0, 1)^response_exponent)
response_factor = 1.0
response_exponent = 1.0

[atmosphere]
height = 0.45
background = [0.0, 0.0, 0.0] # Sky radiance beyond the atmosphere.
scattering = { color = [0.175, 0.3525, 0.77], intensity = 4.0 }

[stars]
# World-fixed geodesic planes. The perpendicular feet are uniform by area
# in a disk around noon. The gap range is the plane-to-Earth distance in R.
count = 1536
seed = 0x33cd831e60109289
ground_radius = 5.0
gap = [4.9, 5.9]
cool_color = [0.72, 0.83, 1.0]
warm_color = [1.0, 0.87, 0.67]
# Intensity interpolates between the endpoints using U^intensity_exponent.
intensity = [0.005, 0.125]
intensity_exponent = 3.0

[observer]
# Intrinsic ground displacements along local X, then local Z, in curvature radii.
spawn_ground = [0.0, 1.3]
yaw_degrees = 0.0
pitch_degrees = 8.021409
pitch_limit_degrees = 89.0
height = 0.01875
walk_speed = 0.1             # curvature radii per second
jump_height = 0.00478515625  # maximum rise from standing height
gravity = 0.1125             # curvature radii per second squared

[view]
window_size = [960, 720]
fov_degrees = 66.849622
min_fov_degrees = 9.147843
max_fov_degrees = 151.927513
near_distance = 0.005        # curvature radii along the optical axis
look_sensitivity = 2.0       # radians per viewport width or height of motion
zoom_sensitivity = 0.002     # multiplier in exp(-scroll * sensitivity)
max_frame_seconds = 0.1      # maximum time advanced in one interactive frame

[vegetation]
seed = 0
sites_per_species = 8
maturity = [0.65, 1.0]

[vegetation.grid]
view_radius = 1.5 # Intrinsic radius around the observer, in curvature radii.
log_height = 0.3  # Logarithmic height of an equal-area band.
width = 0.3       # Cell width relative to the bottom height of the band.
# Maximum candidate sites in the visible patch, counting all three species.
# With sites_per_species = 0 the budget covers the number of cells.
max_patch_sites = 1_048_576

# light_range is the fraction of noon illumination over which occupancy
# moves smoothly between its two endpoints. Growth is relative to mature size.
[vegetation.deciduous]
height = 0.0625
bark = [0.29, 0.14, 0.055]
foliage = [0.28, 0.51, 0.10]
material = { kind = "diffuse", color = [1.0, 1.0, 1.0] }
ecology = { light_range = [0.055, 0.42], occupancy = [0.0, 0.40], minimum_size = 0.35, half_saturation = 0.24 }

[vegetation.pine]
height = 0.055
bark = [0.29, 0.14, 0.055]
# Foliage tiers from the bottom to the tip.
foliage = [[0.07, 0.32, 0.14], [0.095, 0.39, 0.15], [0.15, 0.47, 0.18]]
material = { kind = "diffuse", color = [1.0, 1.0, 1.0] }
ecology = { light_range = [0.003, 0.10], occupancy = [0.0003, 0.30], minimum_size = 0.22, half_saturation = 0.10 }
# Fraction of pines removed in bright daylight, with its own smooth transition.
daylight_range = [0.055, 0.42]
daylight_suppression = 0.55

[vegetation.grass]
blades = 9
blade_height = [0.004, 0.0085]
blade_width = 0.00225
spread_radius = 0.00925
# Vertex tints from root to tip.
colors = [[0.18, 0.39, 0.06], [0.28, 0.53, 0.09], [0.35, 0.61, 0.13]]
material = { kind = "translucent", color = [1.0, 1.0, 1.0], transmission = 0.22 }
ecology = { light_range = [0.001, 0.19], occupancy = [0.006, 0.78], minimum_size = 0.25, half_saturation = 0.06 }
