<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10151e">
  <title>Hypertrace viewer</title>
  <link data-trunk rel="copy-file" href="bootstrap.js">
  <script src="bootstrap.js"></script>
  <link rel="icon" href="data:,">
  <link data-trunk rel="rust" href="../Cargo.toml" data-bin="viewer" data-wasm-opt="0">
  <style>
    :root { color-scheme: dark; font: 14px system-ui, sans-serif; color: #e6edf5; background: #10151e; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 16px 24px; border-bottom: 1px solid #293343; }
    h1 { font-size: 19px; letter-spacing: -.03em; margin: 0; }
    .title { margin-right: auto; }
    .title p { color: #9caec3; margin: 3px 0 0; font-size: 12px; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    a { color: #a2d9f2; }
    label { display: flex; align-items: center; gap: 6px; color: #acbdd0; }
    button, select { font: inherit; padding: 7px 10px; border: 1px solid #3a485c; border-radius: 6px; background: #1c2737; color: #e6edf5; }
    button { cursor: pointer; }
    #pause { width: 6em; }
    button:hover, select:hover { background: #29394e; }
    :focus-visible { outline: 2px solid #86c7ff; outline-offset: 3px; }
    .example-description { margin: 0; padding: 10px 24px; color: #b9cadd; background: #151d29; border-bottom: 1px solid #293343; line-height: 1.5; }
    main { position: relative; flex: 1; min-height: 0; contain: size; }
    /* Winit sets an initial inline size; let its ResizeObserver follow the page. */
    canvas { display: block; width: 100% !important; height: 100% !important; outline: none; touch-action: none; }
    canvas:focus-visible { outline: 2px solid #86c7ff; outline-offset: -2px; }
    #status { position: absolute; left: 18px; top: 14px; max-width: min(600px, calc(100% - 36px)); margin: 0; padding: 8px 12px; background: #10151ede; border-radius: 6px; pointer-events: none; }
    #status[data-error="true"] { color: #ffb4ab; border: 1px solid #d56f68; }
    footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 20px; padding: 10px 24px; font-size: 12px; color: #acbdd0; border-top: 1px solid #293343; }
    footer > span:first-child { flex: 1 1 600px; }
    #stats { color: #d2e5f7; font-variant-numeric: tabular-nums; flex: 0 0 38ch; text-align: right; white-space: nowrap; }
    noscript { padding: 20px; }
    @media (max-width: 640px) { header { padding: 12px; gap: 10px; } footer, .example-description { padding: 10px 12px; } .controls { gap: 6px; } }
  </style>
</head>
<body>
  <header>
    <div class="title"><h1>Hypertrace</h1><p><a href="../run.html" target="_top">Build and run locally</a></p></div>
    <div class="controls" aria-label="Scene controls">
      <label>Example <select id="scene" aria-describedby="example-description" disabled><option value="">Loading examples…</option></select></label>
      <label>Quality <select id="resolution"><option value="640">Fast</option><option value="960" selected>Balanced</option><option value="1440">Sharp</option><option value="0">Full resolution</option></select></label>
      <button id="reset" type="button">Reset view</button>
      <button id="pause" type="button" aria-pressed="false">Pause</button>
    </div>
  </header>
  <p id="example-description" class="example-description" aria-live="polite">Examples are loading…</p>
  <main>
    <canvas id="canvas" tabindex="0" aria-label="Interactive path traced scene. Drag to look, Tab to lock the mouse, WASD to move."></canvas>
    <p id="status" role="status" aria-live="polite">Loading renderer…</p>
  </main>
  <footer>
    <span>Drag: look · <span id="mouse-lock-status" role="status" aria-live="polite">Tab: lock mouse</span> · WASD / arrows: move · Space / C: up / down · Q / E: roll · Scroll: zoom · R: reset · Esc: pause when unlocked</span>
    <span id="stats">Progressive path tracing</span>
  </footer>
  <noscript>Enable JavaScript to run the renderer.</noscript>
</body>
</html>
