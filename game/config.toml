# All colors are linear RGB. Lengths use the curvature radius R, time uses seconds.
# Fermi coordinates on Earth follow the reference X geodesic, then its perpendicular Z.
[earth]
material.reflection = { weight = 1.0, color = [0.23, 0.48, 0.10] }

[earth.grid]
view_radius = 1.5 # Intrinsic radius around the observer, in curvature radii.
# Maximum candidate sites in the loaded patch, counting all three plant species
# and stars. Each loaded pentagon counts for at least one site.
max_patch_sites = 1_048_576

# Each Sun has its own noon point and independent disk, surface and air radiances.
# Ambient color is the added daytime fill above the shared night level.
[[suns]]
# Warm Sun at the world origin.
ground_offset = [0.0, 0.0]
distance = 3.0
disk_radiance = [100.0, 100.0, 60.0]
surface_radiance = [100.0, 100.0, 60.0]
scattering_radiance = [40.0, 80.0, 192.0]
ambient = { color = [0.19, 0.285, 0.38], response_factor = 1.0, response_exponent = 1.0 }

[suns.vegetation]
# Peak density is plants per R². Radius and half-width are ground distances in R.
deciduous = { peak_density = 41.16, peak_radius = 0.0, half_width = 0.97, half_saturation = 0.07, max_size = 1.0 }
pine = { peak_density = 30.87, peak_radius = 4.25, half_width = 1.25, half_saturation = 3e-5, max_size = 1.0 }
grass = { peak_density = 41.16, peak_radius = 0.0, half_width = 4.47, half_saturation = 5e-6, max_size = 1.0 }

[[suns]]
# A broad red Sun over pine woodland.
ground_offset = [-4, -1]
distance = 1.6
disk_radiance = [14.0, 6.0, 2.0]
surface_radiance = [14.0, 6.0, 2.0]
scattering_radiance = [5.5, 0.6, 0.3]
ambient = { color = [0.095, 0.026, 0.02], response_factor = 0.8, response_exponent = 1.0 }

[suns.vegetation]
pine = { peak_density = 46.78, peak_radius = 0.21, half_width = 0.36, half_saturation = 0.04, max_size = 1.0 }
grass = { peak_density = 25.72, peak_radius = 0.0, half_width = 1.56, half_saturation = 0.03, max_size = 0.70 }

[[suns]]
# A small high-radiance blue Sun over grassland.
ground_offset = [6, -2]
distance = 3.2
disk_radiance = [120.0, 240.0, 360.0]
surface_radiance = [120.0, 240.0, 360.0]
scattering_radiance = [40.0, 200.0, 1000.0]
ambient = { color = [0.018, 0.042, 0.12], response_factor = 2.0, response_exponent = 1.0 }

[suns.vegetation]
grass = { peak_density = 77.17, peak_radius = 0.0, half_width = 1.94, half_saturation = 0.01, max_size = 1.0 }

[moon]
ground_offset = [1.2, 2.0]
distance = 2.0
subdivisions = 16
material.reflection = { weight = 1.0, color = [100.0, 100.0, 100.0] }

[ambient]
night = [0.01, 0.015, 0.02]

[atmosphere]
height = 0.45
background = [0.0, 0.0, 0.0] # Sky radiance beyond the atmosphere.

[stars]
# Mean number of stars per R² of Earth, sampled uniformly within each pentagon.
density = 3.3391908820476757
seed = 0x33cd831e60109289
gap = [6, 8] # Perpendicular distance from Earth to a star plane, in R.
# Each star samples a uniform mix of these two linear RGB radiances.
colors.start = [100.0, 80.0, 40.0]
colors.end = [40.0, 80.0, 100.0]

[observer]
# Intrinsic ground displacements along local X, then local Z, in curvature radii.
spawn_ground = [0.0, 1.3]
yaw_degrees = 0.0
pitch_degrees = 8.021409
pitch_limit_degrees = 89.0
height = 0.01875
walk_speed = 0.1            # curvature radii per second
jump_height = 0.00478515625 # maximum rise from standing height
gravity = 0.1125            # curvature radii per second squared

[view]
window_size = [1920, 1080]
fov_degrees = 66.849622
min_fov_degrees = 9.147843
max_fov_degrees = 151.927513
near_distance = 0.005        # curvature radii along the optical axis
look_sensitivity = 2.0       # radians per viewport width or height of motion
zoom_sensitivity = 0.002     # multiplier in exp(-scroll * sensitivity)
max_frame_seconds = 0.1      # maximum time advanced in one interactive frame

[vegetation]
seed = 0
maturity = [0.65, 1.0]

# Each Sun lists the species it supports. These values set the shared night
# baseline; meshes, materials, and candidate sites belong to the species.
[vegetation.deciduous]
height = 0.0625
bark = [0.29, 0.14, 0.055]
foliage = [0.28, 0.51, 0.10]
material.reflection = { weight = 1.0 }
ecology = { night_density = 0.0, minimum_size = 0.35 }

[vegetation.pine]
height = 0.055
bark = [0.29, 0.14, 0.055]
foliage.lower = [0.07, 0.32, 0.14]
foliage.middle = [0.095, 0.39, 0.15]
foliage.upper = [0.15, 0.47, 0.18]
material.reflection = { weight = 1.0 }
ecology = { night_density = 0.03087, minimum_size = 0.22 }

[vegetation.grass]
blades = 9
blade_height = [0.004, 0.0085]
blade_width = 0.00225
spread_radius = 0.00925
colors.root = [0.18, 0.39, 0.06]
colors.middle = [0.28, 0.53, 0.09]
colors.tip = [0.35, 0.61, 0.13]
material.reflection = { weight = 0.78 }
material.transmission = { weight = 0.22 }
ecology = { night_density = 0.30866, minimum_size = 0.25 }
