[package]
name = "hypergame"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
bytemuck = "1"
ccgeom = "0.1.1"
hypertrace-scene = { path = "../scene" }
wgame = { version = "0.1.0", default-features = false, features = ["desktop", "shapes"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

[dev-dependencies]
futures = { version = "0.3", features = ["executor"] }
wgame = { version = "0.1.0", default-features = false, features = ["image"] }
