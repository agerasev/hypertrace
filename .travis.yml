language: rust
os: linux
dist: jammy
rust: stable

before_script:
  - git clone --depth 1 https://github.com/agerasev/vecmat-rs.git ../vecmat-rs
  - git clone --depth 1 https://github.com/agerasev/ccgeom.git ../ccgeom
  # Cargo resolves the optional viewer path dependency for headless builds too.
  - git clone --depth 1 https://github.com/agerasev/wgame.git ../wgame

script:
  - cargo fmt --all -- --check
  - cargo test --workspace --all-targets
  - python3 -m unittest discover -s tools -p 'test_*.py'
