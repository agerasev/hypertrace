# All colors are linear RGB. Lengths use the curvature radius R, time uses seconds.
# Coordinates on Earth are local X and Z displacements applied in that order.
[earth]
material.reflection = { weight = 1.0, color = [0.23, 0.48, 0.10] }

[earth.grid]
view_radius = 1.5 # Intrinsic radius around the observer, in curvature radii.
# Maximum candidate sites in the loaded patch, counting all three plant species
# and stars. Each loaded pentagon counts for at least one site.
max_patch_sites = 1_048_576

[sun]
distance = 3.0
emission = [100.0, 100.0, 60.0]

[moon]
ground_offset = [1.2, 0.0]
distance = 2.0
subdivisions = 16
material.reflection = { weight = 1.0 }

[ambient]
night = [0.01, 0.015, 0.02]
day = [0.2, 0.3, 0.4]
# mix(night, day, clamp(response_factor * peak_solar_radiance * sin²(disk_radius), 0, 1)^response_exponent)
response_factor = 1.0
response_exponent = 1.0

[atmosphere]
height = 0.45
background = [0.0, 0.0, 0.0] # Sky radiance beyond the atmosphere.
scattering = [0.4, 0.8, 3.2]

[stars]
# Mean number of stars per R² of Earth, sampled uniformly within each pentagon.
density = 3.3391908820476757
seed = 0x33cd831e60109289
gap = [6, 8] # Perpendicular distance from Earth to a star plane, in R.
# Each star samples a uniform mix of these two linear RGB radiances.
colors.start = [100.0, 80.0, 40.0]
colors.end = [40.0, 80.0, 100.0]

[observer]
# Intrinsic ground displacements along local X, then local Z, in curvature radii.
spawn_ground = [0.0, 1.3]
yaw_degrees = 0.0
pitch_degrees = 8.021409
pitch_limit_degrees = 89.0
height = 0.01875
walk_speed = 0.1            # curvature radii per second
jump_height = 0.00478515625 # maximum rise from standing height
gravity = 0.1125            # curvature radii per second squared

[view]
window_size = [1920, 1080]
fov_degrees = 66.849622
min_fov_degrees = 9.147843
max_fov_degrees = 151.927513
near_distance = 0.005        # curvature radii along the optical axis
look_sensitivity = 2.0       # radians per viewport width or height of motion
zoom_sensitivity = 0.002     # multiplier in exp(-scroll * sensitivity)
max_frame_seconds = 0.1      # maximum time advanced in one interactive frame

[vegetation]
seed = 0
# Candidate roots per species per R². Occupancy and growth still depend on light.
site_density_per_species = 102.88789102693553
maturity = [0.65, 1.0]

# light_range is the fraction of noon illumination over which occupancy
# moves smoothly between its two endpoints. Lower both limits to extend
# a species into dusk. Lower half_saturation to keep it tall in dim light.
[vegetation.deciduous]
height = 0.0625
bark = [0.29, 0.14, 0.055]
foliage = [0.28, 0.51, 0.10]
material.reflection = { weight = 1.0 }
ecology = { light_range = [
    0.012,
    0.23,
], occupancy = [
    0.0,
    0.40,
], minimum_size = 0.35, half_saturation = 0.07 }

[vegetation.pine]
height = 0.055
bark = [0.29, 0.14, 0.055]
foliage.lower = [0.07, 0.32, 0.14]
foliage.middle = [0.095, 0.39, 0.15]
foliage.upper = [0.15, 0.47, 0.18]
material.reflection = { weight = 1.0 }
ecology = { light_range = [
    2e-6,
    8e-5,
], occupancy = [
    0.0003,
    0.30,
], minimum_size = 0.22, half_saturation = 3e-5 }
# Fraction of pines removed in bright daylight, with its own smooth transition.
daylight_range = [0.055, 0.42]
daylight_suppression = 0.55

[vegetation.grass]
blades = 9
blade_height = [0.004, 0.0085]
blade_width = 0.00225
spread_radius = 0.00925
colors.root = [0.18, 0.39, 0.06]
colors.middle = [0.28, 0.53, 0.09]
colors.tip = [0.35, 0.61, 0.13]
material.reflection = { weight = 0.78 }
material.transmission = { weight = 0.22 }
ecology = { light_range = [
    2e-7,
    1e-5,
], occupancy = [
    0.003,
    0.4,
], minimum_size = 0.25, half_saturation = 5e-6 }
